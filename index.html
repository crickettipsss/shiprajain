<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIPRA JAIN™ | Telegram</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background:
    radial-gradient(ellipse at top left, #21120f, transparent 48%),
    radial-gradient(ellipse at bottom right, #00332f, transparent 48%),
    #020711;
  font-family: Arial, sans-serif;
  color: #eef5ff;
}

.container {
  width: 100%;
  max-width: 650px;
  text-align: center;
  padding: 38px 26px;
  border: 1px solid #263b49;
  border-radius: 48px;
  background: linear-gradient(160deg, #07111d, #050d18);
  box-shadow: 0 0 25px rgba(0, 204, 255, 0.07);
}

.logo {
  width: 210px;
  height: 210px;
  max-width: 65vw;
  max-height: 65vw;
  border-radius: 50%;
  object-fit: cover;
  padding: 6px;
  border: 6px solid transparent;
  background:
    linear-gradient(#07111d, #07111d) padding-box,
    linear-gradient(120deg, #e8e8c9, #00d9ff) border-box;
  box-shadow: 0 0 20px rgba(0, 213, 255, 0.25);
  margin-bottom: 35px;
}

.verified {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: #00d9ff;
  border: 1px solid #008fae;
  border-radius: 40px;
  padding: 13px 24px;
  font-size: 21px;
  margin-bottom: 40px;
}

.check {
  border: 3px solid #00d9ff;
  border-radius: 50%;
  width: 29px;
  height: 29px;
  line-height: 25px;
  font-weight: bold;
}

h1 {
  font-size: 40px;
  margin-bottom: 18px;
  font-weight: 700;
}

.fire {
  font-size: 45px;
  margin-bottom: 28px;
}

.description {
  color: #aeb8c7;
  font-size: 25px;
  line-height: 1.8;
  margin-bottom: 42px;
}

.join {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 17px;
  width: 100%;
  min-height: 98px;
  border-radius: 32px;
  background: linear-gradient(100deg, #079fe8, #00c8ed);
  color: white;
  text-decoration: none;
  font-size: 29px;
  box-shadow: 0 8px 28px rgba(0, 190, 255, 0.18);
}

.join:active {
  transform: scale(0.98);
}

.telegram {
  font-size: 32px;
}

.note {
  color: #8793a4;
  font-size: 20px;
  margin: 32px 0 48px;
}

hr {
  border: 0;
  border-top: 1px solid #263442;
}

.footer {
  color: #7f8b9c;
  font-size: 18px;
  margin-top: 35px;
}

@media (max-width: 480px) {
  .container {
    padding: 30px 20px;
    border-radius: 38px;
  }

  .logo {
    width: 170px;
    height: 170px;
    margin-bottom: 28px;
  }

  .verified {
    font-size: 16px;
    padding: 10px 18px;
    margin-bottom: 32px;
  }

  h1 {
    font-size: 30px;
  }

  .description {
    font-size: 18px;
    line-height: 1.65;
    margin-bottom: 32px;
  }

  .join {
    min-height: 76px;
    font-size: 22px;
    border-radius: 27px;
  }

  .note {
    font-size: 16px;
    margin: 26px 0 38px;
  }

  .footer {
    font-size: 14px;
    margin-top: 28px;
  }
}
</style>
</head>

<body>

<div class="container">

  <img src="logo.jpg" class="logo" alt="Shipra Jain">

  <div class="verified">
    <span class="check">✓</span>
    Cricket Updates Channel
  </div>

  <h1>SHIPRA JAIN™</h1>

  <div class="fire">🔥</div>

  <p class="description">
    Exclusive cricket insights, match analysis, and
    live updates shared inside our Telegram channel.
  </p>

  <a class="join" href="https://t.me/+ZwfLVyYc5DU4ZTY1">
    <span class="telegram">➤</span>
    Join on Telegram
  </a>

  <p class="note">
    Click above to access the channel
  </p>

  <hr>

  <div class="footer">
    © 2026 SHIPRA JAIN™ · Independent cricket channel
  </div>

</div>

</body>
</html>
